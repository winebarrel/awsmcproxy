# awsmcproxy.yml

# Optional. The AWS MCP Server endpoint every profile connects to.
# Default: https://aws-mcp.us-east-1.api.aws/mcp
# endpoint: https://aws-mcp.us-east-1.api.aws/mcp

# Optional. SigV4 signing service and region. Both are inferred from the
# endpoint hostname, so they are only needed for an endpoint whose name does
# not identify them. Leave signing_region unset when profiles use endpoints in
# different regions.
# service: aws-mcp
# signing_region: us-east-1

# Optional. Sent as MCP _meta entries on every request, for all profiles.
# AWS_REGION here is the fallback for a profile with no 'region'.
# metadata:
#   AWS_REGION: us-east-1

# Values are expanded with os.ExpandEnv, so ${ENV_VAR} references work.
#
# Each profile gets its own connection, signed with that profile's credentials:
#   aws_profile -> the profile in ~/.aws/config (aws login / aws sso login /
#                  assumed roles / static keys all work)
#   region      -> the AWS_REGION metadata entry, which is the default region
#                  for the AWS operations the server runs
profiles:
  - name: dev
    aws_profile: my-dev
    region: us-east-1
  - name: prod
    aws_profile: my-prod
    region: ap-northeast-1
    # Optional. Connect this profile to a different endpoint.
    # endpoint: https://aws-mcp.eu-central-1.api.aws/mcp
    # Optional extra _meta entries for this profile. AWS_REGION here wins over
    # the 'region' above.
    # metadata:
    #   AWS_REGION: ap-northeast-3
